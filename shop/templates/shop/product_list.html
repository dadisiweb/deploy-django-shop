{% extends "shop/base.html" %}

{% block content %}

<div class="container">
  <h1 class="title">🛍️ Products</h1>

  <div class="grid">
    {% for product in products %}

    <a href="/product/{{ product.id }}/" class="card">

      {% if product.image %}
        <img src="{{ product.image.url }}" class="img" />
      {% else %}
        <div class="img placeholder">No Image</div>
      {% endif %}

      <div class="info">
        <div class="name">{{ product.name }}</div>
        <div class="price">KES {{ product.price }}</div>
      </div>

    </a>

    {% endfor %}
  </div>
</div>

<style>
.container {
  max-width: 1100px;
  margin: auto;
  padding: 30px;
  color: white;
}

.title {
  font-size: 28px;
  margin-bottom: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
}

.card {
  background: #1e293b;
  border-radius: 14px;
  overflow: hidden;
  text-decoration: none;
  color: white;
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-5px);
  background: #273449;
}

.img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #334155;
  color: #94a3b8;
}

.info {
  padding: 12px;
}

.name {
  font-weight: bold;
  margin-bottom: 5px;
}

.price {
  color: #22c55e;
  font-weight: bold;
}
</style>

{% endblock %}
