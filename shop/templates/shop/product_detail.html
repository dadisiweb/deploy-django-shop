{% extends "shop/base.html" %}

{% block content %}

<style>
  .product-container {
    display: flex;
    gap: 40px;
    max-width: 900px;
    margin: 40px auto;
    background: #0f172a;
    padding: 30px;
    border-radius: 16px;
    color: white;
  }

  .product-image {
    flex: 1;
  }

  .product-image img {
    width: 100%;
    border-radius: 12px;
    object-fit: cover;
  }

  .product-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .product-title {
    font-size: 28px;
    font-weight: bold;
  }

  .product-desc {
    color: #94a3b8;
    line-height: 1.5;
  }

  .price {
    font-size: 22px;
    font-weight: bold;
    color: #22c55e;
  }

  .btn {
    margin-top: 15px;
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    cursor: pointer;
    font-size: 16px;
    transition: 0.2s;
  }

  .btn:hover {
    background: #2563eb;
  }

  .back {
    margin-top: 20px;
    color: #94a3b8;
    text-decoration: none;
  }

  .back:hover {
    color: white;
  }
</style>

<div class="product-container">

  <div class="product-image">
    {% if product.image %}
      <img src="{{ product.image.url }}" />
    {% else %}
      <img src="https://via.placeholder.com/400x400" />
    {% endif %}
  </div>

  <div class="product-info">
    <div class="product-title">{{ product.name }}</div>

    <div class="price">KES {{ product.price }}</div>

    <div class="product-desc">
      {{ product.description }}
    </div>

    <form method="post" action="/cart/add/{{ product.id }}/">
      {% csrf_token %}
      <button class="btn">Add to Cart</button>
    </form>

    <a class="back" href="/">← Back to products</a>
  </div>

</div>

{% endblock %}
