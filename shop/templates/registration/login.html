{% extends "shop/base.html" %}

{% block content %}

<style>
  .auth-container {
    max-width: 400px;
    margin: 80px auto;
    background: #0f172a;
    padding: 30px;
    border-radius: 16px;
    color: white;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }

  .auth-container h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  .auth-container input {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: none;
    background: #1e293b;
    color: white;
  }

  .auth-container button {
    width: 100%;
    padding: 12px;
    background: #3b82f6;
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    font-size: 16px;
  }

  .auth-container button:hover {
    background: #2563eb;
  }

  .auth-footer {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
    color: #94a3b8;
  }

  .auth-footer a {
    color: #3b82f6;
    text-decoration: none;
  }

  .auth-footer a:hover {
    text-decoration: underline;
  }
</style>

<div class="auth-container">
  <h2>Login</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
  </form>

  <div class="auth-footer">
    Don't have an account?
    <a href="/signup/">Sign up</a>
  </div>
</div>

{% endblock %}
