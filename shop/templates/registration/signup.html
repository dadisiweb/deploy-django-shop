{% extends "shop/base.html" %}

{% block content %}

<div class="auth-container">
  <h2>Create Account</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create account</button>
  </form>

  <div class="auth-footer">
    Already have an account?
    <a href="/accounts/login/">Login</a>
  </div>
</div>

{% endblock %}
